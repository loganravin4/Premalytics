spring.application.name=premalytics-backend
server.port=8080

# Load .env from the project root (one level up from backend/, the app's CWD)
spring.config.import=optional:file:../.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:premalytics_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:pl_data}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Python interpreter — path to the project venv
ml.python.interpreter=../data-pipeline/venv/Scripts/python.exe
ml.project.root=${user.dir}/..

# CORS — allow the Vite dev server
cors.allowed.origins=http://localhost:5173
